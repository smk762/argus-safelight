# Safelight. The fixture mock is the `mock` profile (`COMPOSE_PROFILES=mock` in
# .env), so the UI can run without a GPU. Against a live darkroom, omit that
# profile and set NEXT_PUBLIC_DARKROOM_URL to the real server. The real pairing
# also lives in argus-darkroom's compose file.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DARKROOM_URL: ${NEXT_PUBLIC_DARKROOM_URL:-http://localhost:8106}
    environment:
      - PORT=${PORT:-3097}
    ports:
      - "${PORT:-3097}:${PORT:-3097}"
    depends_on:
      mock-darkroom:
        condition: service_started
        required: false
    restart: unless-stopped

  mock-darkroom:
    profiles: [mock]
    image: node:22-alpine
    working_dir: /repo
    command: ["node", "scripts/mock_darkroom.mjs"]
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./fixture:/repo/fixture:ro
    environment:
      - MOCK_PORT=8106
      # DEVMODE=1 in .env is what darkroom's compose maps to ARGUS_DARKROOM_DEVMODE;
      # the mock reads the same name so the purge button appears the same way.
      - MOCK_DEVMODE=${DEVMODE-1}
      - MOCK_NSFW_ALLOWED=${MOCK_NSFW_ALLOWED-1}
      - MOCK_OLLAMA=${MOCK_OLLAMA-1}
      - MOCK_SINGGUARD=${MOCK_SINGGUARD-1}
      - MOCK_NUDENET=${MOCK_NUDENET-1}
      - MOCK_AGE=${MOCK_AGE-1}
    ports:
      - "${MOCK_PORT:-8106}:8106"
    restart: unless-stopped
