name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mock darkroom serves the fixture
        run: |
          node scripts/mock_darkroom.mjs &
          sleep 1
          curl -sf localhost:8106/health
          curl -sf 'localhost:8106/records?page_size=100' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).total;if(n<12)throw new Error("expected the fixture, got "+n)})'
          curl -sf -o /dev/null localhost:8106/image/fx-passed
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8106/image/fx-deleted-illegal)" = 404
